# Deploy to Cloudflare Pages via Direct Upload.
#
# This workflow is for sites provisioned by the kantan panel, which creates a
# Cloudflare Pages project WITHOUT a Git connection and writes three repository
# secrets (CF_API_TOKEN, CF_ACCOUNT_ID, CF_PAGES_PROJECT). Every push to main —
# including content edits made in the Decap CMS editor — rebuilds and deploys
# the site.
#
# CF_PAGES_PROJECT is the panel-specific marker: classic Git-connected forks
# that followed decap-oauth-setup.yml also carry CF_API_TOKEN/CF_ACCOUNT_ID, so
# gating on those would run this job for them. When CF_PAGES_PROJECT is absent
# (classic forks), the workflow skips itself cleanly: Cloudflare builds those
# sites itself.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
      # Optional: set the site's canonical URL (used by RSS/sitemap). The kantan
      # panel can set this as a repository variable (PUBLIC_SITE_URL) when it
      # provisions a site; astro.config.mjs prefers it over config.json.
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - name: Check for panel-provisioned credentials
        id: gate
        run: |
          if [ -z "$CF_PAGES_PROJECT" ]; then
            echo "No CF_PAGES_PROJECT secret — skipping direct-upload deploy."
            echo "(Classic Git-connected Pages projects are built by Cloudflare automatically.)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # The panel provisions the Pages project under this exact name.
          command: pages deploy dist --project-name=${{ secrets.CF_PAGES_PROJECT }}
