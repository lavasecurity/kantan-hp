<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Enable manual initialization so we can inject a fork-aware OAuth backend. -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      const { initCMS } = window;
      // The OAuth proxy runs as Cloudflare Pages Functions on this site itself,
      // so base_url must be the site's own origin: Decap posts back to the
      // popup's parent window and the origin has to match exactly. Using
      // location.origin makes /admin work on any fork or custom domain with no
      // per-site configuration. These two keys are merged over config.yml by
      // Decap (deepmerge); the repo/branch still come from config.yml, which is
      // the single place to update when you fork to your own GitHub account.
      initCMS({
        config: {
          backend: {
            base_url: location.origin,
            auth_endpoint: '/api/auth',
          },
        },
      });
    </script>
  </body>
</html>
